<defs><style>text{font-family:Inter,Arial,sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#526079}.head{font-size:17px;font-weight:700}.body{font-size:14px}.box{fill:#f7f9fc;stroke:#8a9bb5;stroke-width:2}.blue{fill:#e8f2ff;stroke:#4385cf;stroke-width:2}.green{fill:#e8f7ef;stroke:#32956a;stroke-width:2}.purple{fill:#f2ebff;stroke:#8c6ac8;stroke-width:2}.line{stroke:#65758b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#65758b"/></marker></defs>
